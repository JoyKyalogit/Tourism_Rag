services:
  - type: web
    name: safiri-kenya-api
    runtime: python
    plan: free
    rootDir: backend
    # Index is already in vectorstore/ea_travel_faiss — skip ingest on build.
    # CPU torch only: default torch pulls ~2GB CUDA wheels and never finishes boot.
    buildCommand: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TOKENIZERS_PARALLELISM
        value: "false"

  - type: web
    name: safiri-kenya-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -l $PORT
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
